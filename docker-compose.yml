
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: threatforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: threatforge_dev
    volumes:
      - threatforge_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threatforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./threatforge/backend
    env_file:
      - ./threatforge/backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:threatforge_dev@db:5432/threatforge
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./threatforge/frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  threatforge_postgres_data:
